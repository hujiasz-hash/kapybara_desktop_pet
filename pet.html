<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%;
               font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               user-select: none; cursor: pointer; }
  img { position: absolute; inset: 0; width: 100%; height: 100%;
        image-rendering: pixelated; display: none; pointer-events: none; }
  img.on { display: block; }
</style>
</head>
<body>
<script>
/* ---------- 帧库（18 动作，420x420，已预缩放） ---------- */
const FRAME_FILES = {
  front:    'frame_01_idle_front.png',
  left:     'frame_02_look_left.png',
  right:    'frame_03_look_right.png',
  up:       'frame_04_look_up.png',
  walking:  'frame_05_walking.png',
  sleeping: 'frame_06_sleeping.png',
  cheering: 'frame_07_cheering.png',
  spacing_out: 'frame_08_spacing_out.png',
  typing_laptop: 'frame_09_typing_laptop.png',
  drinking_coffee: 'frame_10_drinking_coffee.png',
  picked_up: 'frame_11_picked_up.png',
  hot_spring: 'frame_12_hot_spring.png',
  nodding_off: 'frame_13_nodding_off.png',
  orange_balancing: 'frame_14_orange_balancing.png',
  fast_running: 'frame_15_fast_running.png',
  offering_heart: 'frame_16_offering_heart.png',
  munching_clover: 'frame_17_munching_clover.png',
  eating_orange: 'frame_18_eating_orange.png',
};
const FRAME_SRC = {};
const img = document.createElement('img');
img.className = 'on';
document.body.appendChild(img);
for (const [key, file] of Object.entries(FRAME_FILES)) {
  const pre = new Image();
  pre.src = 'ui/frames/' + file;      // 预热缓存
  FRAME_SRC[key] = 'ui/frames/' + file;
}

/* ---------- 帧状态机 ----------
   优先级：拖动(提溜) > 事件行为(欢呼/爱心) > 随机行为 > 朝向idle */
let mode = 'idle';        // idle | <行为键名> | dragged
let look = 'front';       // front | left | right | up
let holdUntil = 0;        // 行为保持截止时间戳
let eventHoldUntil = 0;   // 事件动画保持截止

function frameName() {
  const now = Date.now();
  if (mode === 'dragged') return 'picked_up';
  if (now < eventHoldUntil) return mode;      // 事件动画
  if (now < holdUntil) return mode;           // 随机行为
  mode = 'idle';
  return look;
}
function render() { img.src = FRAME_SRC[frameName()]; }

/* ---------- 主进程事件：答完欢呼 / 打开问答送爱心 ---------- */
window.buddy.onPetEvent((e) => {
  const now = Date.now();
  if (now < eventHoldUntil) return;           // 不打断进行中的事件动画
  if (e === 'cheer') { mode = 'cheering'; eventHoldUntil = now + 1500; }
  else if (e === 'greet') { mode = 'offering_heart'; eventHoldUntil = now + 1500; }
  render();
});

/* ---------- 鼠标朝向（idle 时生效） ---------- */
window.buddy.onCursor(({ mx, my, px, py }) => {
  const now = Date.now();
  if (now < holdUntil || now < eventHoldUntil || mode === 'dragged') return;
  const cx = px + 55, cy = py + 55;
  const dx = mx - cx, dy = my - cy;
  let want = 'front';
  if (dx < -55) want = 'left';
  else if (dx > 55) want = 'right';
  else if (dy < -75) want = 'up';
  if (want !== look) { look = want; render(); }
});

/* ---------- 随机行为池（键, 时长ms, 权重, 连招下一帧） ---------- */
const BEHAVIORS = [
  ['walking',         3000, 3, null],
  ['fast_running',    2000, 1, null],
  ['nodding_off',     3200, 2, 'sleeping'],      // 打瞌睡 → 趴下睡死
  ['spacing_out',     4000, 2, null],
  ['orange_balancing',2500, 2, null],
  ['munching_clover', 3000, 2, null],
  ['eating_orange',   3000, 2, null],
  ['drinking_coffee', 2500, 1, 'typing_laptop'],  // 咖啡续命 → 打工
  ['typing_laptop',   5000, 1, null],
  ['hot_spring',      8000, 1, null],
];
const CHAIN_DUR = { sleeping: 6000, typing_laptop: 5000 };
function weightedPick() {
  const total = BEHAVIORS.reduce((s, b) => s + b[2], 0);
  let r = Math.random() * total;
  for (const b of BEHAVIORS) { if ((r -= b[2]) < 0) return b; }
  return BEHAVIORS[0];
}
function scheduleBehavior() {
  setTimeout(() => {
    if (mode === 'idle' && Date.now() >= eventHoldUntil) {
      const [name, dur, _w, chain] = weightedPick();
      mode = name;
      holdUntil = Date.now() + dur;
      render();
      if (chain) {
        setTimeout(() => {
          if (mode === name) {            // 中途没被打断才接连招
            mode = chain;
            holdUntil = Date.now() + CHAIN_DUR[chain];
            render();
          }
        }, dur);
      }
    }
    scheduleBehavior();
  }, 4000 + Math.random() * 7000);
}
scheduleBehavior();

/* ---------- 拖动：被提溜起来 ---------- */
let down = null, dragging = false;
document.addEventListener('mousedown', (e) => {
  down = { x: e.clientX, y: e.clientY };
  dragging = false;
});
document.addEventListener('mousemove', (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (dragging || Math.hypot(dx, dy) > 5) {
    if (!dragging) { dragging = true; mode = 'dragged'; render(); }
    window.buddy.petDragBy(e.movementX, e.movementY);
  }
});
document.addEventListener('mouseup', () => {
  if (down && !dragging) window.buddy.petClick();
  if (dragging) { mode = 'idle'; render(); }
  down = null;
  dragging = false;
});

render();
</script>
</body>
</html>
