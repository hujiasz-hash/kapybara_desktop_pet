<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%;
               font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               user-select: none; cursor: pointer; }
  img { position: absolute; inset: 0; width: 100%; height: 100%;
        image-rendering: pixelated; display: none; pointer-events: none; }
  img.on { display: block; }
</style>
</head>
<body>
<script>
/* ================================================================
   卡皮巴拉桌宠 · 渲染层
   素材：17 个动作 × 3 帧（420x420 透明 PNG），各动作帧序与节奏照抄作者给的 GIF。
   帧序不是简单 1→2→3 循环：typing 是 [1,2,3,2] 乒乓、clover 是 [1,2,1,2,3] 等。
   ================================================================ */

/* ---------- 朝向（静态，沿用旧素材四帧；已下移 19px 与新动作帧对齐到同一脚底线） ---------- */
const IDLE_SRC = {
  front: 'ui/frames/idle_front.png',
  left:  'ui/frames/idle_left.png',
  right: 'ui/frames/idle_right.png',
  up:    'ui/frames/idle_up.png',
  idle:  'ui/frames/idle_front.png',   // 防御：意外用 'idle' 作帧名时不落空
};

/* ---------- 逐帧动画表：seq = 用第几帧，durs = 每帧毫秒（与 GIF 一致） ---------- */
const ANIM = {
  typing:        { seq: [1, 2, 3, 2],   durs: [180, 150, 180, 150] },   // 敲键盘打工
  picked_up:     { seq: [1, 2, 1, 3],   durs: [280, 280, 280, 280] },   // 被拎悬空扑腾
  coffee:        { seq: [1, 2, 3],      durs: [600, 600, 600] },        // 喝热咖啡摸鱼
  cheering:      { seq: [1, 2, 3],      durs: [350, 450, 350] },        // 欢呼雀跃跳跃
  spacing_out:   { seq: [1, 2, 3],      durs: [700, 700, 700] },        // 灵魂出窍发呆
  hot_spring:    { seq: [1, 2, 3, 2],   durs: [500, 500, 500, 500] },   // 泡温泉顶毛巾
  walk:          { seq: [1, 2, 3, 2],   durs: [220, 220, 220, 220] },   // 漫步走动巡逻
  run:           { seq: [1, 2, 3],      durs: [140, 140, 140] },        // 贴地快跑冲刺
  nodding:       { seq: [1, 2, 3],      durs: [800, 1000, 800] },       // 完整版（含"惊醒"帧）→ 只在鼠标动时播
  nodding_calm:  { seq: [1, 2],         durs: [800, 1000], src: 'nodding' }, // 打瞌睡循环：掐掉第 3 帧（眼睛圆睁+汗）
  sleep:         { seq: [1, 2, 3, 1],   durs: [700, 700, 700, 700] },   // 趴下安睡打盹
  orange_trick:  { seq: [1, 2, 3],      durs: [400, 350, 400] },        // 顶橘颠球绝活
  clover:        { seq: [1, 2, 1, 2, 3], durs: [350, 300, 450, 350, 300] },  // 大嚼三叶草
  heart:         { seq: [1, 2, 3, 1],   durs: [500, 700, 600, 500] },   // 手捧爱心互动
  eating_orange: { seq: [1, 2, 3],      durs: [450, 400, 500] },        // 细品橘子果肉
  angry_zen:     { seq: [1, 2, 3, 1],   durs: [600, 700, 600, 600] },   // 气到冒烟但超淡定
  thinking:      { seq: [1, 2, 3, 2],   durs: [600, 600, 600, 600] },   // 托腮深度思考
  inspiration:   { seq: [1, 2, 3],      durs: [600, 500, 700] },        // 灵光一现灯泡
};
const ANIM_SRC = {};   // 动作名 → 帧 URL 数组（按 seq 展开，index 与播放序号对应）
for (const [name, a] of Object.entries(ANIM)) {
  const base = a.src || name;                 // 允许复用别的动作的帧文件（如 nodding_calm 用 nodding 的帧）
  ANIM_SRC[name] = a.seq.map((n) => `ui/frames/${base}_${n}.png`);
}

const img = document.createElement('img');
img.onerror = () => console.error('[pet] FRAME-FAIL src=' + img.getAttribute('src'));
img.className = 'on';
document.body.appendChild(img);

/* 预载 + 校验：任何一个文件缺失都会在日志里留下 PRELOAD-FAIL */
for (const [k, u] of Object.entries(IDLE_SRC)) {
  const pre = new Image();
  pre.onerror = () => console.error('[pet] PRELOAD-FAIL idle:' + k + ' → ' + u);
  pre.src = u;
}
for (const [name, urls] of Object.entries(ANIM_SRC)) {
  for (const u of urls) {
    const pre = new Image();
    pre.onerror = () => console.error('[pet] PRELOAD-FAIL ' + name + ' → ' + u);
    pre.src = u;
  }
}

/* ---------- 播放速度 ----------
   素材作者给的 GIF 节奏偏快，实测"换得太勤、眼花"，统一放慢一档；
   快跑保住冲刺感所以少放慢一点。 */
const FRAME_SCALE = { run: 1.15 };   // 个别动作覆盖
const FRAME_SCALE_DEFAULT = 1.4;     // 其余统一放慢

/* ---------- 帧播放器：每帧时长可能不同，所以用递归 setTimeout ---------- */
let animName = null, animTimer = null, animIdx = 0;
function play(name) {
  if (animName === name) return;             // 同一动作：继续播，不重启（避免每 500ms tick 重置动画）
  animName = name;
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
  animIdx = 0;
  const urls = ANIM_SRC[name];
  if (!urls) { img.src = IDLE_SRC[name] || IDLE_SRC.idle; return; }   // 朝向等静态帧
  img.src = urls[0];
  tickFrame();
}
function tickFrame() {
  const name = animName, a = ANIM[name];
  const scale = FRAME_SCALE[name] || FRAME_SCALE_DEFAULT;
  animTimer = setTimeout(() => {
    if (animName !== name) return;
    animIdx = (animIdx + 1) % a.seq.length;
    img.src = ANIM_SRC[name][animIdx];
    tickFrame();
  }, a.durs[animIdx] * scale);
}

/* ---------- 节奏参数（?fast=1 测试用短阈值） ---------- */
const FAST = new URLSearchParams(location.search).has('fast');
const NOD_AFTER   = (FAST ? 3 : 30) * 1000;   // 鼠标静止 30s → 打瞌睡（点头循环，不含"惊醒"帧）
const SLEEP_AFTER = (FAST ? 6 : 60) * 1000;   // 再不动 30s（共 60s）→ 趴下安睡

// 鼠标进到桌宠周边这个半径内（约贴到它跟前）→ 优先看着鼠标，不演自娱
const NEAR_R = 50;

/* ---------- 状态机 ----------
   优先级：拖动 > hook 事件（瞬时反馈 > 工作态）> 睡意 > 自娱随机 > 朝向待机
   mode      : idle | dragged | <动作名>（自娱行为 或 惊醒过渡）
   drowsy    : null 清醒 | 'nod' 打瞌睡 | 'sleep' 趴下安睡（都保持到鼠标动）
   mouseNear : 鼠标是否在桌宠周边 NEAR_R 内（决定朝向优先于自娱）
   eventMode : hook 事件驱动的动作（pi 侧来事件时设）
   鼠标一动就重新计时，并立刻从睡意里醒过来 */
let mode = 'idle';
let look = 'front';
let drowsy = null;
let eventMode = null, eventKind = null, eventHoldUntil = 0, eventHoldPri = 0;
let workFallback = null;            // 工作态兜底：瞬时反馈播完回到它（agent_settled 时清空）
let behaviorHoldUntil = 0;
let nextBehaviorAt = Date.now() + 6000 + Math.random() * 4000;
let lastMouse = { x: -1, y: -1 };
let mouseNear = false;
let mouseDist = 9999;
let lastActivity = Date.now();
const dragged = () => mode === 'dragged';

function frameName() {
  const now = Date.now();
  if (mode === 'dragged') return 'picked_up';                  // 1 被拖动
  if (eventMode && now < eventHoldUntil) return eventMode;     // 2 hook 事件
  if (drowsy === 'sleep') return 'sleep';                      // 3 趴下安睡（保持）
  if (drowsy === 'nod') return 'nodding_calm';                 // 4 打瞌睡：点头循环，不播"惊醒"帧
  if (mouseNear) return look;                                  // 5 鼠标在附近 → 看着鼠标（优先于自娱）
  if (now < behaviorHoldUntil && mode !== 'idle') return mode; // 6 自娱 / 惊醒过渡
  return look;                                                 // 7 朝向待机
}
function render() {
  const k = frameName();
  if (document.body.dataset.state !== k) document.body.dataset.state = k;   // 仅供调试观察
  play(k);
}

/* ---------- 鼠标朝向 + 空闲检测（主进程 120ms 推送全局光标） ---------- */
window.buddy.onCursor(({ mx, my, px, py }) => {
  const moved = mx !== lastMouse.x || my !== lastMouse.y;
  lastMouse = { x: mx, y: my };
  const cx = px + 55, cy = py + 55;                            // 桌宠中心
  const dx = mx - cx, dy = my - cy;
  mouseDist = Math.round(Math.hypot(dx, dy));
  mouseNear = mouseDist <= NEAR_R;                              // 鼠标是否在周边
  if (moved) {
    lastActivity = Date.now();
    if (drowsy) wake();                                        // 鼠标一动就醒
  }
  if (mode === 'idle' && !drowsy && !eventMode) {               // 朝向跟随
    let want = 'front';
    if (dx < -20) want = 'left';          // 方向判定阈值 20px（原先 55/75，比 50px 触发圈还大，
    else if (dx > 20) want = 'right';     // 导致凑近时只能显示正面，看不到它往哪边看）
    else if (dy < -20) want = 'up';
    if (want !== look) { look = want; render(); }
  }
});

/* 醒来：先演一轮"坐立瞌睡惊醒"（末帧就是惊醒），再回到正常 */
function wake() {
  drowsy = null;
  mode = 'nodding';        // 完整版：末帧就是"惊醒"（眼睛圆睁+汗），只有鼠标动能把它放出来
  behaviorHoldUntil = Date.now() + 3600;                        // 一轮 nodding（放慢后 800+1000+800 各 ×1.4）
  nextBehaviorAt = Date.now() + 8000 + Math.random() * 5000;
  lastActivity = Date.now();
  render();
}

/* ---------- 无 hook 时的自娱池（只在桌宠自己活着时用） ---------- */
const IDLE_BEHAVIORS = [
  ['walk',          9000, 3,   null],   // 漫步巡逻（一轮 1.2s → 约 7 轮）
  ['run',           6000, 1,   null],   // 快跑冲刺
  ['clover',       10000, 2,   null],   // 嚼三叶草（一轮 1.8s → 约 6 轮）
  ['eating_orange', 9000, 2,   null],   // 吃橘子
  ['coffee',       12000, 2,   null],   // 喝咖啡摸鱼（一轮 2.5s → 约 5 轮）
  ['orange_trick',  9000, 2,   null],   // 顶橘绝活
  ['spacing_out',  11000, 2,   null],   // 灵魂出窍发呆
  ['hot_spring',   14000, 0.5, null],   // 泡温泉（彩蛋级，少见）
];
// 两个自娱动作之间空多久（原先 2~4.5s，太密导致"一直在换"）
const GAP_MIN = 7000, GAP_RAND = 7000;
function weightedPick(pool) {
  const p = pool || IDLE_BEHAVIORS;
  const total = p.reduce((s, b) => s + b[2], 0);
  let r = Math.random() * total;
  for (const b of p) { if ((r -= b[2]) < 0) return b; }
  return p[0];
}
function playBehavior(preferSwap) {
  let pick = weightedPick();
  if (preferSwap && pick[0] === mode) pick = weightedPick();     // 右键时尽量换个动作
  const [name, dur] = pick;
  mode = name;
  // 注意：这里绝不能刷新 lastActivity —— 自娱行为每几秒触发一次，
  // 一刷新 lastActivity 就永远到不了 15s/30s 的睡意阈值（旧版就是这么坏掉的）。
  behaviorHoldUntil = Date.now() + dur;
  nextBehaviorAt = behaviorHoldUntil + GAP_MIN + Math.random() * GAP_RAND;
  render();
}

/* ---------- 右键：换个动画 ---------- */
document.addEventListener('contextmenu', (e) => e.preventDefault());   // 只屏蔽系统菜单（切动作在 mousedown(2)）

/* ---------- hook 事件（pi 侧推送） ----------
   动作: [默认时长ms, 优先级, 类型]
     once = 瞬时反馈，播完回工作态（若还在干活）或待机
     work = 工作态，一直挂着直到下一个事件（时长只是兜底上限）

   抢占规则（踩过的坑）：不能简单地"优先级低就忽略"——真实事件几乎同时到达
   （session_start 到 agent_start 只隔零点几秒），长保持期会把后面的事件全吃掉，
   结果卡皮巴拉一直捧着爱心不进入思考/打工。现在的规则：
     ・同名事件在保持期内重复到达 → 忽略（防抖）
     ・新事件总能接管（代表更新的状态）
     ・例外：高优先级的瞬时反馈正在播时，低优先级事件让路（别把欢呼/生气掐掉） */
const EVENT_ANIM = {
  heart:       [3200, 2, 'once'],      // session_start    → 捧爱心打招呼（1 轮）
  inspiration: [2500, 2, 'once'],      // 工具跑成功       → 灵光一现（1 轮）
  angry_zen:   [3500, 3, 'once'],      // 工具跑失败       → 气到冒烟（1 轮）
  cheering:    [3200, 3, 'once'],      // agent_settled    → 干完了欢呼（2 轮）
  thinking:    [120000, 2, 'work'],    // agent_start      → 托腮思考
  typing:      [120000, 2, 'work'],    // 工具执行中       → 敲键盘打工
  spacing_out: [3000, 2, 'once'],      // 压缩上下文       → 发呆（1 轮）
};

window.buddy.onPetEvent((e, ms) => {
  const now = Date.now();
  if (e === 'drag-lost') { endDrag(); return; }        // 主进程兜底：mouseup 丢失强制恢复
  if (mode === 'dragged') return;                      // 拖动优先，事件不打扰
  const cfg = EVENT_ANIM[e];
  if (!cfg) return;
  const [defMs, pri, kind] = cfg;
  if (now < eventHoldUntil) {
    if (e === eventMode) return;                       // 同名防抖
    if (eventKind === 'once' && pri < eventHoldPri) return;   // 瞬时反馈播放中：低优先级让路
  }
  const dur = ms || defMs;
  eventMode = e; eventKind = kind;
  eventHoldUntil = now + dur; eventHoldPri = pri;
  if (kind === 'work') workFallback = e;               // 记住工作态，供瞬时反馈返回
  if (e === 'cheering' || e === 'sleep') workFallback = null;   // 干完了 / 收工：不再回工作态
  lastActivity = now;
  drowsy = null;
  render();
});

/* ---------- 主循环（500ms tick） ---------- */
setInterval(() => {
  const now = Date.now();
  if (dragged()) return;

  // 事件保持期到点
  if (eventMode && now >= eventHoldUntil) {
    if (eventKind === 'once' && workFallback) {        // 还在干活 → 回到工作态
      eventMode = workFallback;
      eventKind = 'work';
      eventHoldUntil = now + EVENT_ANIM[workFallback][0];
      eventHoldPri = EVENT_ANIM[workFallback][1];
      render();
      return;
    }
    eventMode = null; eventKind = null; eventHoldPri = 0;
  }
  if (eventMode) return;                               // 事件占着，睡意/自娱都不掺和

  const idleMs = now - lastActivity;
  if (idleMs > SLEEP_AFTER) {                          // 趴下安睡
    if (drowsy !== 'sleep') { drowsy = 'sleep'; render(); }
    return;
  }
  if (idleMs > NOD_AFTER) {                            // 打瞌睡：点头循环，自娱停掉
    if (drowsy !== 'nod') { drowsy = 'nod'; render(); }
    return;
  }
  if (drowsy) { drowsy = null; render(); }

  if (mouseNear) {                                     // 鼠标在附近：优先看着鼠标，不演自娱
    if (mode !== 'idle') { mode = 'idle'; render(); }
    nextBehaviorAt = now + GAP_MIN;
    return;
  }

  if (now >= behaviorHoldUntil) {                      // 活跃期：自娱随机
    if (mode !== 'idle') { mode = 'idle'; render(); }
    if (now >= nextBehaviorAt) playBehavior();
  }
}, 500);

/* ---------- 拖动：被提溜（拖动全程算活动，不会睡着） ---------- */
let down = null, dragging = false;
document.addEventListener('mousedown', (e) => {
  if (e.button === 2) {                                // 右键：换个动画（mousedown 入口对轻点/按压都稳定）
    if (mode !== 'dragged') playBehavior(true);
    return;
  }
  if (e.button !== 0) return;                          // 其余只认左键
  down = { x: e.clientX, y: e.clientY };
  dragging = false;
  lastActivity = Date.now();
  window.buddy.petDragStart(e.screenX, e.screenY);
  try { document.body.setPointerCapture(e.pointerId); } catch (_) {}
});
function endDrag() {
  mode = 'idle'; look = 'front';
  behaviorHoldUntil = 0;   // 拖动打断行为：保持期一并作废
  window.buddy.petDragEnd();
  down = null;
  dragging = false;
  render();
}
document.addEventListener('mousemove', (e) => {
  lastActivity = Date.now();
  if (!down) return;
  // 兜底：鼠标已在窗口外松开、mouseup 丢失（buttons=0 = 无任何按键）
  if (e.buttons === 0) { endDrag(); return; }
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (dragging || moved > 5) {
    if (!dragging) { dragging = true; mode = 'dragged'; render(); }
    window.buddy.petDragMove(e.screenX, e.screenY);
  }
});
document.addEventListener('mouseup', (e) => {
  if (e.button !== 0) return;   // 只认左键；右键松开不得触发拖动收尾
  try { document.body.releasePointerCapture(e.pointerId); } catch (_) {}
  const wasClick = down && !dragging;
  endDrag();
  if (wasClick) window.buddy.petClick();
});

window.__petState = () => JSON.stringify({
  mode, look, frame: frameName(), drowsy, eventMode, workFallback, mouseNear, mouseDist,
  imgOK: img.complete && img.naturalWidth > 0, imgSrc: img.getAttribute('src'),
  idleSec: Math.round((Date.now() - lastActivity) / 1000),
  behaviorHoldMs: Math.round(behaviorHoldUntil - Date.now()),
  nextBehaviorMs: Math.round(nextBehaviorAt - Date.now()),
  eventHoldMs: Math.round(eventHoldUntil - Date.now()),
});
render();
</script>
</body>
</html>
