<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; height: 100%; overflow: hidden;
               font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #panel {
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(24, 25, 28, 0.68);
    backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: 14px;
    overflow: hidden;
  }
  /* 顶部：标题区（可拖动） + 卡皮巴拉 */
  #bar {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 6px 10px 0 16px;
    -webkit-app-region: drag;
    user-select: none;
  }
  .brand { display: flex; flex-direction: column; gap: 3px; padding-bottom: 8px; }
  .brand .title {
    color: #c9a87b; font-size: 11.5px; letter-spacing: 1.5px; font-weight: 600;
  }
  .brand .hint  { color: #6e7175; font-size: 10px; }
  /* ---------- 卡皮巴拉 ---------- */
  #capy-wrap { position: relative; width: 96px; height: 66px; flex: none;
               -webkit-app-region: no-drag; cursor: pointer; }
  #capy { width: 100%; height: 100%; overflow: visible; }
  #capy .head { transform-origin: 60px 85px; transition: transform 0.35s ease; }
  #capy.hop .head    { animation: capy-hop 0.8s ease; }
  #capy.happy .head  { animation: capy-hop 0.6s ease; }
  #capy.tilt .head   { animation: capy-tilt 1.1s ease; }
  #capy.chew .muzzle { animation: capy-chew 0.32s ease 4; transform-origin: 40px 55px; }
  #capy .eye { transform-box: fill-box; transform-origin: center; transition: transform 0.1s; }
  #capy.blink .eye  { animation: capy-blink 0.45s ease; }
  #capy.sleep .eye  { transform: scaleY(0.12); }
  #capy.sleep .eye .pupil { opacity: 0; }
  #capy.happy .eye  { transform: scaleY(0.32); }
  #capy .pupil { transform-box: fill-box; transition: transform 0.14s ease-out; }
  #zzz { position: absolute; top: -4px; right: -2px; color: #9aa0a6;
         font-size: 11px; opacity: 0; pointer-events: none; }
  #capy-wrap.sleeping #zzz { animation: zzz 2.2s ease infinite; }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0,4px);} 30%{opacity:1;} 100% { opacity: 0; transform: translate(8px,-10px);} }
  @keyframes capy-hop  { 0%,100%{ transform: translateY(0);} 30%{ transform: translateY(-7px);} 55%{ transform: translateY(0);} 75%{ transform: translateY(-4px);} }
  @keyframes capy-tilt { 0%,100%{ transform: rotate(0);} 45%{ transform: rotate(-8deg);} 75%{ transform: rotate(5deg);} }
  @keyframes capy-chew { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(2px);} }
  @keyframes capy-blink{ 0%,100%{ transform: scaleY(1);} 40%{ transform: scaleY(0.08);} 60%{ transform: scaleY(0.08);} }
  /* 输入区 */
  #inputrow {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 16px 10px;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }
  #inputrow:focus-within { border-color: rgba(176, 137, 104, 0.75); }
  #dot { width: 8px; height: 8px; border-radius: 50%;
         background: #c9a87b; flex: none; cursor: pointer; }
  #dot.busy { background: #f59e42; animation: pulse 0.9s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.75); } }
  #q {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e8eaed; font-size: 15px; caret-color: #c9a87b;
  }
  #q::placeholder { color: #6e7175; }
  /* 思考中指示器 */
  #thinking {
    display: none; align-items: center; gap: 8px;
    margin: 0 16px 6px; color: #c9a87b; font-size: 12px;
  }
  .tdots { display: inline-flex; gap: 5px; }
  .tdots span {
    width: 7px; height: 7px; border-radius: 50%; background: #c9a87b;
    animation: tbounce 1.2s infinite;
  }
  .tdots span:nth-child(2) { animation-delay: 0.18s; }
  .tdots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes tbounce {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30%           { opacity: 1;    transform: translateY(-4px); }
  }
  /* 回答区 */
  #a {
    flex: 1; margin: 0 16px 12px; padding: 4px 2px;
    overflow-y: auto;
    color: #eceff1; font-size: 13.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }
  #a .dim { color: #8b8f94; }
  #a b { color: #fff; }
  #a code { color: #e6c79c; background: rgba(255,255,255,0.08); padding: 0 4px; border-radius: 4px; }
  #a::-webkit-scrollbar { width: 6px; }
  #a::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .tdots span, #dot.busy, #zzz { animation: none; }
  }
</style>
</head>
<body>
<div id="panel">
  <div id="bar">
    <div class="brand">
      <span class="title">CAPYBARA BUDDY</span>
      <span class="hint">Esc 关闭 · 点外部隐藏 · Enter 提问</span>
    </div>
    <div id="capy-wrap" title="点我一下">
      <svg id="capy" viewBox="0 0 120 92">
        <g class="head">
          <!-- 耳朵 -->
          <circle cx="40" cy="24" r="6.5" fill="#8a6844"/>
          <circle cx="78" cy="20" r="6.5" fill="#8a6844"/>
          <circle cx="40" cy="24" r="3" fill="#5c4030"/>
          <circle cx="78" cy="20" r="3" fill="#5c4030"/>
          <!-- 头 -->
          <ellipse cx="60" cy="52" rx="39" ry="31" fill="#b08968"/>
          <!-- 吻部 -->
          <g class="muzzle">
            <ellipse cx="36" cy="62" rx="21" ry="16" fill="#d4b48c"/>
            <ellipse cx="28" cy="55" rx="2.6" ry="3.6" fill="#5c4030"/>
            <ellipse cx="38" cy="54" rx="2.6" ry="3.6" fill="#5c4030"/>
            <path d="M28,70 Q36,75 44,70" stroke="#5c4030" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
          <!-- 眼睛 -->
          <g class="eye"><ellipse cx="54" cy="44" rx="7.2" ry="7.8" fill="#f3e9dc"/>
            <g class="pupil"><circle cx="54" cy="44" r="4.2" fill="#2e2318"/><circle cx="52.4" cy="42.2" r="1.3" fill="#fff"/></g>
          </g>
          <g class="eye"><ellipse cx="80" cy="40" rx="7.2" ry="7.8" fill="#f3e9dc"/>
            <g class="pupil"><circle cx="80" cy="40" r="4.2" fill="#2e2318"/><circle cx="78.4" cy="38.2" r="1.3" fill="#fff"/></g>
          </g>
          <!-- 头顶橘子 -->
          <line x1="97" y1="24" x2="99" y2="16" stroke="#7fb069" stroke-width="2" stroke-linecap="round"/>
          <circle cx="101" cy="12" r="7.5" fill="#f59e42"/>
          <ellipse cx="107" cy="6" rx="4.5" ry="2.6" fill="#7fb069" transform="rotate(-25 107 6)"/>
        </g>
      </svg>
      <div id="zzz">z Z z</div>
    </div>
  </div>
  <div id="inputrow">
    <span id="dot" title=""></span>
    <input id="q" placeholder="问点什么，回车发送…" spellcheck="false">
  </div>
  <div id="thinking">
    <span class="tdots"><span></span><span></span><span></span></span>
    <span>思考中…（点黄点可中止）</span>
  </div>
  <div id="a"><span class="dim">回答会显示在这里，每次提问覆盖上一条。</span></div>
</div>
<script>
  const q = document.getElementById('q');
  const a = document.getElementById('a');
  const dot = document.getElementById('dot');
  const thinking = document.getElementById('thinking');
  const capy = document.getElementById('capy');
  const capyWrap = document.getElementById('capy-wrap');
  const pupils = capy.querySelectorAll('.pupil');
  const head = capy.querySelector('.head');
  window.__test = { done: false };

  function showThinking() { thinking.style.display = 'flex'; dot.classList.add('busy'); }
  function hideThinking() { thinking.style.display = 'none'; dot.classList.remove('busy'); }

  /* ---------- 卡皮巴拉：眼睛跟随 + 随机动作 ---------- */
  const eyeTarget = { x: 0, y: 0 };
  const eyeCur = { x: 0, y: 0 };
  window.buddy.onCursor(({ mx, my, wx, wy }) => {
    // 卡皮巴拉中心在窗口内的位置（右上角）
    const cx = wx + 640 - 48, cy = wy + 34;
    const dx = mx - cx, dy = my - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, dist / 260);
    eyeTarget.x = (dx / dist) * 3.2 * k;
    eyeTarget.y = (dy / dist) * 2.6 * k;
    head.style.transform = `rotate(${Math.max(-7, Math.min(7, dx / 60))}deg)`;
  });
  (function eyeLoop() {
    eyeCur.x += (eyeTarget.x - eyeCur.x) * 0.14;
    eyeCur.y += (eyeTarget.y - eyeCur.y) * 0.14;
    pupils.forEach(p => { p.style.transform = `translate(${eyeCur.x}px, ${eyeCur.y}px)`; });
    requestAnimationFrame(eyeLoop);
  })();

  const ACTIONS = ['blink', 'chew', 'tilt', 'hop', 'blink', 'sleep', 'happy'];
  const DUR = { blink: 500, chew: 1400, tilt: 1150, hop: 850, sleep: 2400, happy: 700 };
  function scheduleAction() {
    setTimeout(() => {
      const act = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
      capy.classList.add(act);
      if (act === 'sleep') capyWrap.classList.add('sleeping');
      setTimeout(() => {
        capy.classList.remove(act);
        capyWrap.classList.remove('sleeping');
        scheduleAction();
      }, DUR[act]);
    }, 2000 + Math.random() * 3000);
  }
  scheduleAction();
  capyWrap.addEventListener('click', () => {
    capy.classList.add('happy');
    setTimeout(() => capy.classList.remove('happy'), DUR.happy);
  });

  /* ---------- 问答 ---------- */
  async function submit() {
    const text = q.value.trim();
    if (!text) return;
    const r = await window.buddy.ask(text);
    if (!r.ok && r.reason === 'busy') return;
    q.value = '';
    a.textContent = '';
    window.__test.done = false;
    firstChunk = true;
    raw = '';
    showThinking();
  }

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape') window.buddy.hide();
    e.stopPropagation();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.buddy.hide();
  });

  let firstChunk = true;
  let raw = '';
  function renderMarkdown(src) {
    const esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return esc
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  window.buddy.onAnswerChunk((t) => {
    if (firstChunk) { raw = ''; a.classList.remove('dim'); firstChunk = false; }
    hideThinking();
    raw += t;
    a.innerHTML = renderMarkdown(raw);
    a.scrollTop = a.scrollHeight;
  });
  window.buddy.onAnswerDone(() => {
    hideThinking();
    window.__test.done = true;
  });
  window.buddy.onFocusInput(() => {
    setTimeout(() => q.focus(), 60);
  });
  dot.addEventListener('click', () => window.buddy.stop());
  q.focus();
</script>
</body>
</html>
