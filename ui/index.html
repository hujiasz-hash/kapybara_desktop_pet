<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
  html, body { background: transparent; height: 100%; overflow: hidden;
               font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               letter-spacing: 0.3px; }
  /* 像素风外框：深棕粗边 + 内衬高光边 */
  #frame {
    height: 100%;
    background: #5c4030;
    padding: 3px;
    box-shadow: inset 0 0 0 1px #2e2318;
  }
  #panel {
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(26, 27, 30, 0.94);
    border: 2px solid #8a6844;
    overflow: hidden;
  }
  /* 标题条 */
  #bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    background: rgba(176, 137, 104, 0.16);
    border-bottom: 2px solid #8a6844;
    -webkit-app-region: drag;
    user-select: none;
  }
  #bar .title { color: #e2c9a2; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  #bar .hint  { color: #8b8f94; font-size: 10px; }
  /* 输入区 */
  #inputrow {
    display: flex; align-items: center; gap: 10px;
    margin: 12px 14px 8px;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid #8a6844;
  }
  #inputrow:focus-within { border-color: #e2c9a2; }
  #dot { width: 10px; height: 10px; background: #c9a87b;
         flex: none; cursor: pointer; }
  #dot.busy { background: #f59e42; animation: blink-dot 0.8s steps(2) infinite; }
  @keyframes blink-dot { 50% { opacity: 0.2; } }
  #q {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e8eaed; font-size: 15px; caret-color: #e2c9a2;
  }
  #q::placeholder { color: #6e7175; }
  /* 思考中指示器 */
  #thinking {
    display: none; align-items: center; gap: 8px;
    margin: 0 14px 6px; color: #e2c9a2; font-size: 12px;
  }
  .tdots { display: inline-flex; gap: 4px; }
  .tdots span {
    width: 8px; height: 8px; background: #c9a87b;
    animation: tstep 1s steps(1) infinite;
  }
  .tdots span:nth-child(2) { animation-delay: 0.25s; }
  .tdots span:nth-child(3) { animation-delay: 0.5s; }
  @keyframes tstep { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  /* 回答区 */
  #a {
    flex: 1; margin: 0 14px 12px; padding: 6px;
    overflow-y: auto;
    color: #eceff1; font-size: 13.5px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }
  #a .dim { color: #8b8f94; }
  #a b { color: #fff; }
  #a code { color: #e6c79c; background: rgba(255,255,255,0.08); padding: 0 4px; }
  #a::-webkit-scrollbar { width: 8px; }
  #a::-webkit-scrollbar-thumb { background: #8a6844; }
  #a::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
  @media (prefers-reduced-motion: reduce) {
    .tdots span, #dot.busy { animation: none; }
  }
</style>
</head>
<body>
<div id="frame">
  <div id="panel">
    <div id="bar">
      <span class="title">CAPYBARA BUDDY</span>
      <span class="hint">Esc 关闭 · 点外部隐藏 · Enter 提问</span>
    </div>
    <div id="inputrow">
      <span id="dot" title=""></span>
      <input id="q" placeholder="问点什么，回车发送…" spellcheck="false">
    </div>
    <div id="thinking">
      <span class="tdots"><span></span><span></span><span></span></span>
      <span>思考中…（点黄方块可中止）</span>
    </div>
    <div id="a"><span class="dim">回答会显示在这里，每次提问覆盖上一条。</span></div>
  </div>
</div>
<script>
  const q = document.getElementById('q');
  const a = document.getElementById('a');
  const dot = document.getElementById('dot');
  const thinking = document.getElementById('thinking');
  window.__test = { done: false };

  function showThinking() { thinking.style.display = 'flex'; dot.classList.add('busy'); }
  function hideThinking() { thinking.style.display = 'none'; dot.classList.remove('busy'); }

  async function submit() {
    const text = q.value.trim();
    if (!text) return;
    const r = await window.buddy.ask(text);
    if (!r.ok && r.reason === 'busy') return;
    q.value = '';
    a.textContent = '';
    window.__test.done = false;
    firstChunk = true;
    raw = '';
    showThinking();
  }

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape') window.buddy.hide();
    e.stopPropagation();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.buddy.hide();
  });

  let firstChunk = true;
  let raw = '';
  function renderMarkdown(src) {
    const esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return esc
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  window.buddy.onAnswerChunk((t) => {
    if (firstChunk) { raw = ''; a.classList.remove('dim'); firstChunk = false; }
    hideThinking();
    raw += t;
    a.innerHTML = renderMarkdown(raw);
    a.scrollTop = a.scrollHeight;
  });
  window.buddy.onAnswerDone(() => {
    hideThinking();
    window.__test.done = true;
  });
  window.buddy.onFocusInput(() => {
    setTimeout(() => q.focus(), 60);
  });
  dot.addEventListener('click', () => window.buddy.stop());
  q.focus();
</script>
</body>
</html>
