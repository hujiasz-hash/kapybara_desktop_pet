<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; height: 100%; overflow: hidden;
               font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #panel {
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(24, 25, 28, 0.68);
    backdrop-filter: blur(32px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: 14px;
    overflow: hidden;
  }
  /* 顶部：标题区（可拖动） + 卡皮巴拉 */
  #bar {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 6px 10px 0 16px;
    -webkit-app-region: drag;
    user-select: none;
  }
  .brand { display: flex; flex-direction: column; gap: 3px; padding-bottom: 8px; }
  .brand .title {
    color: #c9a87b; font-size: 11.5px; letter-spacing: 1.5px; font-weight: 600;
  }
  .brand .hint  { color: #6e7175; font-size: 10px; }
  /* ---------- 卡皮巴拉（像素风） ---------- */
  #capy-wrap { position: relative; width: 100px; height: 80px; flex: none;
               -webkit-app-region: no-drag; cursor: pointer; }
  #capy { width: 100px; height: 80px; image-rendering: pixelated;
          transition: transform 0.15s; transform-origin: bottom center; }
  #capy.hop { transform: translateY(-6px); }
  #zzz { position: absolute; top: 0; right: 0; color: #9aa0a6;
         font-size: 11px; opacity: 0; pointer-events: none; }
  #capy-wrap.sleeping #zzz { animation: zzz 2.2s ease infinite; }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0,4px);} 30%{opacity:1;} 100% { opacity: 0; transform: translate(8px,-10px);} }
  /* 输入区 */
  #inputrow {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 16px 10px;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }
  #inputrow:focus-within { border-color: rgba(176, 137, 104, 0.75); }
  #dot { width: 8px; height: 8px; border-radius: 50%;
         background: #c9a87b; flex: none; cursor: pointer; }
  #dot.busy { background: #f59e42; animation: pulse 0.9s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.75); } }
  #q {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e8eaed; font-size: 15px; caret-color: #c9a87b;
  }
  #q::placeholder { color: #6e7175; }
  /* 思考中指示器 */
  #thinking {
    display: none; align-items: center; gap: 8px;
    margin: 0 16px 6px; color: #c9a87b; font-size: 12px;
  }
  .tdots { display: inline-flex; gap: 5px; }
  .tdots span {
    width: 7px; height: 7px; border-radius: 50%; background: #c9a87b;
    animation: tbounce 1.2s infinite;
  }
  .tdots span:nth-child(2) { animation-delay: 0.18s; }
  .tdots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes tbounce {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30%           { opacity: 1;    transform: translateY(-4px); }
  }
  /* 回答区 */
  #a {
    flex: 1; margin: 0 16px 12px; padding: 4px 2px;
    overflow-y: auto;
    color: #eceff1; font-size: 13.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }
  #a .dim { color: #8b8f94; }
  #a b { color: #fff; }
  #a code { color: #e6c79c; background: rgba(255,255,255,0.08); padding: 0 4px; border-radius: 4px; }
  #a::-webkit-scrollbar { width: 6px; }
  #a::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .tdots span, #dot.busy, #zzz { animation: none; }
  }
</style>
</head>
<body>
<div id="panel">
  <div id="bar">
    <div class="brand">
      <span class="title">CAPYBARA BUDDY</span>
      <span class="hint">Esc 关闭 · 点外部隐藏 · Enter 提问</span>
    </div>
    <div id="capy-wrap" title="点我一下">
      <canvas id="capy" width="20" height="16"></canvas>
      <div id="zzz">z Z z</div>
    </div>
    </div>
  <div id="inputrow">
    <span id="dot" title=""></span>
    <input id="q" placeholder="问点什么，回车发送…" spellcheck="false">
  </div>
  <div id="thinking">
    <span class="tdots"><span></span><span></span><span></span></span>
    <span>思考中…（点黄点可中止）</span>
  </div>
  <div id="a"><span class="dim">回答会显示在这里，每次提问覆盖上一条。</span></div>
</div>
<script>
  const q = document.getElementById('q');
  const a = document.getElementById('a');
  const dot = document.getElementById('dot');
  const thinking = document.getElementById('thinking');
  window.__test = { done: false };

  function showThinking() { thinking.style.display = 'flex'; dot.classList.add('busy'); }
  function hideThinking() { thinking.style.display = 'none'; dot.classList.remove('busy'); }

const FRAMES = {
  idle1: [
    "....................",
    ".............g......",
    "............ccc.....",
    "...........dcccd....",
    ".....dddd...ddd.....",
    "...ddooooddd........",
    "..doooooooodd.......",
    ".ddoooeeooooood.....",
    ".dooooeelooooood....",
    ".doooooelllllllld...",
    ".ddddoooolllllld....",
    "..dooooolllllld.....",
    "..ddooooddddddd.....",
    "...dood...dood......",
    "...ddd....ddd.......",
    "...................."
  ],
  idle2: [
    "....................",
    "............g.......",
    "...........ccc......",
    "..........dcccd.....",
    ".....dddd...ddd.....",
    "...ddooooddd........",
    "..doooooooodd.......",
    ".ddoooeeooooood.....",
    ".dooooeelooooood....",
    ".doooooelllllllld...",
    ".ddddoooolllllld....",
    "..dooooolllllld.....",
    "..ddooooddddddd.....",
    "...dood...dood......",
    "...ddd....ddd.......",
    "...................."
  ],
  blink: [
    "....................",
    ".............g......",
    "............ccc.....",
    "...........dcccd....",
    ".....dddd...ddd.....",
    "...ddooooddd........",
    "..doooooooodd.......",
    ".ddoooooooooood.....",
    ".doooooedooooood....",
    ".doooooelllllllld...",
    ".ddddoooolllllld....",
    "..dooooolllllld.....",
    "..ddooooddddddd.....",
    "...dood...dood......",
    "...ddd....ddd.......",
    "...................."
  ],
  hop: [
    ".............g......",
    "............ccc.....",
    "...........dcccd....",
    ".....dddd...ddd.....",
    "...ddooooddd........",
    "..doooooooodd.......",
    ".ddoooeeooooood.....",
    ".dooooeelooooood....",
    ".doooooelllllllld...",
    ".ddddoooolllllld....",
    "..dooooolllllld.....",
    "..ddooooddddddd.....",
    "...dood...dood......",
    "...ddd....ddd.......",
    "....................",
    "...................."
  ],
};

  const PAL = { o:'#b08968', d:'#5c4030', l:'#d4b48c', e:'#221a12', c:'#f59e42', g:'#7fb069' };
  const capy = document.getElementById('capy');
  const capyWrap = document.getElementById('capy-wrap');
  const ctx = capy.getContext('2d');

  // 眼睛像素坐标（从 idle1 提取）
  const EYE_PIXELS = [];
  FRAMES.idle1.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'e') EYE_PIXELS.push([x, y]); }));

  function draw(frame, pupilOff, drawPupils) {
    ctx.clearRect(0, 0, 20, 16);
    for (let y = 0; y < frame.length; y++) {
      for (let x = 0; x < 20; x++) {
        const ch = frame[y][x];
        if (ch === '.') continue;
        ctx.fillStyle = PAL[ch === 'e' ? 'o' : ch];   // 眼睛位置先画身体色
        ctx.fillRect(x, y, 1, 1);
      }
    }
    if (drawPupils) {
      ctx.fillStyle = PAL.e;
      for (const [x, y] of EYE_PIXELS) ctx.fillRect(x + pupilOff.x, y + pupilOff.y, 1, 1);
    }
  }

  // 眼睛跟随（全局鼠标，主进程 120ms 推送）
  const eyeTarget = { x: 0, y: 0 }, eyeCur = { x: 0, y: 0 };
  window.buddy.onCursor(({ mx, my, wx, wy }) => {
    const cx = wx + 640 - 50, cy = wy + 40;
    const dx = mx - cx, dy = my - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, dist / 260);
    eyeTarget.x = Math.round((dx / dist) * k);   // 像素风：偏移只有 -1/0/1
    eyeTarget.y = Math.round((dy / dist) * k);
  });

  // 帧状态机
  let cur = 'idle1', pupilOff = { x: 0, y: 0 };
  let tick = 0;
  setInterval(() => {
    tick++;
    if (cur === 'idle1' || cur === 'idle2') {
      cur = (tick % 8 === 0) ? 'idle2' : 'idle1';   // 偶尔晃一下橘子
      draw(FRAMES[cur], eyeCur, cur !== 'blink');
    }
  }, 180);

  // 随机动作
  const ACTIONS = ['blink', 'hop', 'blink', 'sleep', 'hop'];
  const DUR = { blink: 500, hop: 650, sleep: 2200 };
  function playAction(act) {
    if (act === 'blink') { draw(FRAMES.blink, { x: 0, y: 0 }, false); }
    else if (act === 'hop') {
      capy.classList.add('hop'); draw(FRAMES.hop, pupilOff, true);
      setTimeout(() => { capy.classList.remove('hop'); draw(FRAMES[cur], pupilOff, true); }, 320);
    }
    else if (act === 'sleep') { draw(FRAMES.blink, { x: 0, y: 0 }, false); capyWrap.classList.add('sleeping'); }
    setTimeout(() => {
      capy.classList.remove('hop'); capyWrap.classList.remove('sleeping');
      draw(FRAMES[cur], pupilOff, true);
    }, DUR[act]);
  }
  function scheduleAction() {
    setTimeout(() => {
      if (!['blink','hop','sleep'].includes(cur)) playAction(ACTIONS[Math.floor(Math.random() * ACTIONS.length)]);
      scheduleAction();
    }, 2200 + Math.random() * 3000);
  }
  scheduleAction();

  // 眼睛跟随渲染循环（lerp 平滑 + 常态重绘）
  (function eyeLoop() {
    eyeCur.x += (eyeTarget.x - eyeCur.x) * 0.2;
    eyeCur.y += (eyeTarget.y - eyeCur.y) * 0.2;
    const sx = Math.round(eyeCur.x), sy = Math.round(eyeCur.y);
    if (sx !== pupilOff.x || sy !== pupilOff.y) {
      pupilOff = { x: sx, y: sy };
      if (cur === 'idle1' || cur === 'idle2') draw(FRAMES[cur], pupilOff, true);
    }
    requestAnimationFrame(eyeLoop);
  })();

  capyWrap.addEventListener('click', () => playAction('hop'));
  /* ---------- 问答 ---------- */
  async function submit() {
    const text = q.value.trim();
    if (!text) return;
    const r = await window.buddy.ask(text);
    if (!r.ok && r.reason === 'busy') return;
    q.value = '';
    a.textContent = '';
    window.__test.done = false;
    firstChunk = true;
    raw = '';
    showThinking();
  }

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submit();
    if (e.key === 'Escape') window.buddy.hide();
    e.stopPropagation();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.buddy.hide();
  });

  let firstChunk = true;
  let raw = '';
  function renderMarkdown(src) {
    const esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return esc
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  window.buddy.onAnswerChunk((t) => {
    if (firstChunk) { raw = ''; a.classList.remove('dim'); firstChunk = false; }
    hideThinking();
    raw += t;
    a.innerHTML = renderMarkdown(raw);
    a.scrollTop = a.scrollHeight;
  });
  window.buddy.onAnswerDone(() => {
    hideThinking();
    window.__test.done = true;
  });
  window.buddy.onFocusInput(() => {
    setTimeout(() => q.focus(), 60);
  });
  dot.addEventListener('click', () => window.buddy.stop());
  q.focus();
</script>
</body>
</html>
