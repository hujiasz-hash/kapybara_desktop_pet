# kapybara-buddy Windows 构建（按需触发，不随 push 自动构建）
#
# 触发方式（二选一）：
#   1. 手动：GitHub 仓库页 → Actions → "Build Windows exe" → Run workflow → 选分支
#   2. 打版本标签：git tag v4.0.1 && git push origin v4.0.1
#
# 产物：target/release/kapybara-buddy.exe（绿色单文件，WebView2 走系统自带的）
#       手动触发 → 上传为 workflow artifact（Actions 运行页下载，保留 30 天）
#       tag 触发 → 附加到 Release（仓库 Releases 页）

name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可选，纯标记用）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译缓存：crate 没变时秒级恢复，首次 ~20 分钟，之后 ~3-5 分钟
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-win-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-win-

      - name: Build release
        working-directory: src-tauri
        env:
          # 覆盖 .cargo/config.toml 里 macOS 专属的 build.target-dir
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kapybara-buddy-windows-x64
          path: target/release/kapybara-buddy.exe
          retention-days: 30

      - name: Attach to Release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/kapybara-buddy.exe
