[package]
name = "kapybara-buddy"
version = "5.0.0"
description = "卡皮巴拉桌宠 + 订阅用量悬浮面板（Copilot / 智谱 / 博世MFC，Tauri v2）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "time", "net", "io-util", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
percent-encoding = "2"
chrono = "0.4"

# objc 仅 macOS 需要（当前 src 实际未直接使用，保留给未来平台 API 调用）
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[[bin]]
name = "kapybara-buddy"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
